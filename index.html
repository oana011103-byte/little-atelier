<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fff8f7"><meta name="description" content="petal 拍照亭：把平凡的今天，变成可以收藏的小小瞬间。选择排版、拍照、装饰并下载你的专属照片。"><title>petal — a little photo booth</title><link rel="preload" href="assets/oana-hand.ttf" as="font" type="font/ttf" crossorigin><link rel="stylesheet" href="style.css?v=camera20"></head>

</section></main>
