<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fff8f7"><meta name="description" content="Your little online photobooth. Take photos, choose a border, add stickers and save your strip."><title>Photobooth — little memories</title><link rel="stylesheet" href="style.css?v=motion31"></head>
<body data-step="1"><header><button id="navBooth" class="wordmark">Photobooth<span>♡</span></button><button id="navAbout">About</button></header><main><section class="workspace" id="workspace"><div class="section-top"><nav class="steps" aria-label="Photo steps"><button class="step" data-step="1">1 Layout</button><button class="step" data-step="2">2 Camera</button><button class="step" data-step="3">3 Borders</button><button class="step" data-step="4">4 Stickers</button><button class="step" data-step="5">5 Save</button></nav></div><div class="studio"><section class="controls" id="controlPanel"></section><aside class="preview-area"><div class="preview-heading"><span>Your preview</span><button id="toggleDemo">Hide sample</button></div><div class="preview-stage"><div class="paper-wrap"><div class="sticker-layer" aria-label="Photo stickers"></div><canvas id="strip" width="600" height="1800" aria-label="Photo preview"></canvas><img id="saveImage" alt="Your finished photostrip" hidden></div></div></aside><section class="frame-picker" id="framePicker" hidden><div class="frame-picker-title"><h2>Borders</h2><span id="selectedFrame">Cream</span></div><div id="borderCategories" class="border-categories"></div><div class="material-grid" id="frameGrid" aria-label="Border materials"></div></section><section class="sticker-picker" aria-label="Stickers" hidden><h2>Stickers</h2><div class="emoji-categories" aria-label="Sticker categories"></div><div class="sticker-tray"></div><div class="emoji-library-footer"><span id="emojiStatus" role="status"></span><button id="emojiMore" hidden>More</button></div></section></div><footer class="page-actions" id="pageActions" aria-label="Step actions"></footer></section></main><dialog id="about"><button class="close" aria-label="Close">×</button><h2>A little photobooth</h2><p>Choose a layout. Take your photos. Make them yours.</p><p>Photos stay in your browser. Save your strip before refreshing.</p><p>Emoji data: Unicode / CLDR. <a href="assets/UNICODE-LICENSE.txt">License</a>. Some artwork: Twitter Twemoji, <a href="assets/stickers/LICENSE-GRAPHICS">CC BY 4.0</a>.</p></dialog><div id="toast" role="status"></div><script type="module" src="app.js?v=motion31"></script></body></html>
